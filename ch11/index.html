<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee table</title>
	<style>
		body {
			font-family: Arial, Helvetica, sans-serif;
            font-size: 100%;
			width: 80%;
			margin: 1em auto;
		}
		table {
			border-collapse: collapse;
			border: 1px solid black;
			width:60%;
		}
		thead {
			background-color: lightgreen;
		}
		th, td {
			border: 1px solid black;
			padding: .35em 1em .35em .5em;
			text-align: left;
			vertical-align: middle;
			border-left:none;
		}
		
        tbody td:last-child {
            text-align: right;
        }
		tfoot td:last-child{
			text-align: right;
		}
		tfoot{
			background-color: lightgreen;
			& td{
				border:none;
			}
		}
	
		figure{
			display:flex;
			justify-content: center;
			align-items: center;
			flex-direction: column;

	}
		.left{
			border-right:none;
			font-weight: bold;
			text-align: left;
			vertical-align: top;
		}

		@media only screen and (max-width: 640px){
			td:nth-child(3n +1 of :not(.left)){
				background-color: lightgray;
			}
			td:last-child::before {
				display: block;
				content: "Years of Service:";
				text-align: left;
				position:absolute;
			}
			tfoot td:last-child::before {
				display: none;
	
			}
			tfoot td:last-child{
				display:none
			}
			tfoot td:nth-child(3)::after{
			
				content:  ": 105";
				text-align:right;
			
			}
			tfoot td{
				font-weight: bold;
			}
		
		thead{
			display: none;
		}
		table{
			.left{
				background-color: lightgreen;
			}
			th, td{
			display:block;
			}
			
		}
		}
	
		
	</style>
</head>

<body>
	<figure>
		<figcaption><h2>Employee Table</h2></figcaption>
<table>
	
	<thead>
		<tr>
			<th class = "left">Department</th>
			<th>Name</th>
			<th>E-mail</th>
			<th class="right">Years of Service</th>
		</tr>
	</thead>
	<tbody>
		<tr>
			<td rowspan = "3" class = "left">Editorial</td>
			<td>Joel Murach</td>
			<td>joelmurach@yahoo.com</td>
			<td>22</td>
		</tr>
		<tr>
			
			<td>Anne Boehm</td>
			<td>anne@murach.com</td>
			<td>34</td>
		</tr>
		<tr>
			
			<td>Zak Ruvalcaba</td>
			<td>zak@modulemedia.com</td>
			<td>4</td>
		</tr>
		<tr>
			<td rowspan = "2" class = "left">Marketing</td>
			<td>Judy Taylor</td>
			<td>judy@murach.com</td>
			<td>39</td>
		</tr>
		<tr>
			<td>Bethany Lee</td>
			<td>bethany@murach.com</td>
			<td>10</td>
		</tr>
		<tr>
			<td rowspan = "2" class = "left">Customer Service</td>
			<td>Kelly Slivkoff</td>
			<td>kelly@murach.com</td>
			<td>25</td>
		</tr>
		<tr>
			<td>Juliette Baylon</td>
			<td>juliette@murach.com</td>
			<td>1</td>
		</tr>
		<tr>
			<tfoot>
				<tr>
					<td></td>
					<td></td>
					<td>Total Years of Service</td>
					<td>105</td>
				</tr>
			</tfoot>
		</tr>
	</tbody>
</table>
</figure>
</body>
</html>
